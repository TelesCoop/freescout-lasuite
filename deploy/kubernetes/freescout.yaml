apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freescout-data
  labels:
    app.kubernetes.io/name: freescout
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freescout
  labels:
    app.kubernetes.io/name: freescout
spec:
  replicas: 1
  # A ReadWriteOnce volume and migrations run at boot rule out two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: freescout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freescout
    spec:
      imagePullSecrets:
        - name: ghcr-telescoop
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freescout
          image: ghcr.io/telescoop/docker-freescout:sha-1161ae2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: freescout-config
            - secretRef:
                name: freescout-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
          # FreeScout rejects hosts other than APP_URL and APP_TRUSTED_HOSTS; kubelet would send the pod IP.
          startupProbe:
            httpGet: &login-page
              path: /login
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: *login-page
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freescout-data
---
apiVersion: v1
kind: Service
metadata:
  name: freescout
  labels:
    app.kubernetes.io/name: freescout
spec:
  selector:
    app.kubernetes.io/name: freescout
  ports:
    - name: http
      port: 80
      targetPort: http
