services:
  freescout-app:
    build: .
    container_name: freescout-app
    ports:
      - "8080:8080"
    volumes:
      - freescout-data:/data
    environment:
      - TIMEZONE=Europe/Paris

      - DB_TYPE=mariadb
      - DB_HOST=freescout-db
      - DB_PORT=3306
      - DB_NAME=freescout
      - DB_USER=freescout
      - DB_PASS=freescoutpass

      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASS=freescout

      - APP_URL=http://localhost:8080

      - FREESCOUT_APP_LOCALE=fr
      - FREESCOUT_MAIL_DRIVER=log
    depends_on:
      freescout-db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  freescout-db:
    image: mariadb:11
    container_name: freescout-db
    volumes:
      - freescout-db:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_DATABASE=freescout
      - MARIADB_USER=freescout
      - MARIADB_PASSWORD=freescoutpass
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  freescout-data:
  freescout-db:
