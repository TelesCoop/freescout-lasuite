name: Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/telescoop/freescout-lasuite
    steps:
      - uses: actions/checkout@v5

      # The deploy key only grants access to the modules repository, so it is checked out separately.
      - name: Read the pinned modules commit
        id: modules
        run: echo "commit=$(git ls-tree HEAD modules | awk '{print $3}')" >> "${GITHUB_OUTPUT}"

      - name: Checkout FreeScout modules
        uses: actions/checkout@v5
        with:
          repository: suitenumerique/freescout-modules
          ref: ${{ steps.modules.outputs.commit }}
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: modules

      - name: Build image
        run: docker build -t freescout-custom .

      - name: End-to-end test
        run: ./tests/e2e.sh freescout-custom

      - name: Kubernetes deployment test
        run: ./tests/k8s.sh freescout-custom

      - name: Publish to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag freescout-custom "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
