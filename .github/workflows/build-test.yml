name: Build, Test & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/telescoop/freescout-lasuite
    outputs:
      image-tag: ${{ steps.publish.outputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The deploy key only grants access to the modules repository, so it is checked out separately.
      - name: Read the pinned modules commit
        id: modules
        run: echo "commit=$(git ls-tree HEAD modules | awk '{print $3}')" >> "${GITHUB_OUTPUT}"

      - name: Checkout FreeScout modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: suitenumerique/freescout-modules
          ref: ${{ steps.modules.outputs.commit }}
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: modules

      - name: Build image
        run: docker build -t freescout-custom .

      - name: End-to-end test on MariaDB
        run: ./tests/e2e.sh freescout-custom mariadb

      - name: End-to-end test on PostgreSQL, the database of the preprod and the production
        run: ./tests/e2e.sh freescout-custom pgsql

      - name: Kubernetes deployment test
        run: ./tests/k8s.sh freescout-custom

      - name: Publish to GHCR
        id: publish
        # Pull requests and runs started by hand on another branch build and test only.
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag freescout-custom "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          echo "image-tag=sha-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: build-test-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {}
    # Images published in a row reach the preprod and the production in the same order.
    concurrency: deploy
    steps:
      # The deploy key only grants write access to the infrastructure repository, which ArgoCD deploys.
      - name: Checkout the infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: numerique-gouv/infra-freescout
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}

      - name: Deploy the image in preprod and production
        env:
          IMAGE_TAG: ${{ needs.build-test-publish.outputs.image-tag }}
        run: |
          for environment in preprod prod; do
            values="env/${environment}/values.yaml.gotmpl"
            sed -i -E "/^image:/,/^[^ ]/ s/^(  tag: ).*/\1${IMAGE_TAG}/" "${values}"
            grep -qx "  tag: ${IMAGE_TAG}" "${values}" || { echo "No image tag found in ${values}" >&2; exit 1; }
          done
          if git diff --quiet; then
            echo "The preprod and the production already run ${IMAGE_TAG}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: deploy the image ${IMAGE_TAG} in preprod and production"
          git push
