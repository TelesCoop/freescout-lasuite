[www]
user = freescout
group = freescout

listen = /var/run/php-fpm/php-fpm.sock
listen.owner = freescout
listen.group = freescout
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
