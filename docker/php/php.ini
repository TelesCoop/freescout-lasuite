memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_vars = 5000
; php-fpm already forwards error_log() messages: FastCGI logging would repeat them in nginx's error log.
fastcgi.logging = 0
; The entrypoint links this path to the container output: the scheduler discards the stdio of its commands.
error_log = /var/run/freescout/output
