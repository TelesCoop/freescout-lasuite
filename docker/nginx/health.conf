# Liveness endpoint on a port the Service does not expose: answered by php-fpm itself, without Laravel or the database.
server {
    listen 8081;
    access_log off;

    location = /fpm-ping {
        fastcgi_pass  unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include       fastcgi_params;
    }

    location / {
        return 404;
    }
}
