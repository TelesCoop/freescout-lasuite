[supervisord]
nodaemon=true
; nodaemon already prints supervisord's messages to its stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord/supervisord.pid
loglevel=warn

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/worker.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/scheduler.sh
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[eventlistener:exit-on-fatal]
command=/usr/local/bin/exit-on-fatal.sh
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/fd/1
stderr_logfile_maxbytes=0
